name: Release uDrop Windows Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Tray Controller, Standalone Installer, and Portable ZIP
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\installer\build-windows.ps1 -CreatePortableZip

      - name: Run full verification test suite
        shell: pwsh
        run: |
          npm test
          npm run test:win
          .\dist\udrop.exe --stop

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Copy-Item .\dist\udrop-setup.exe .\dist\uDrop-Setup.exe -Force
          $files = @(".\dist\uDrop-Setup.exe", ".\dist\uDrop-Portable-win64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath .\dist\SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/uDrop-Setup.exe
            dist/uDrop-Portable-win64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
