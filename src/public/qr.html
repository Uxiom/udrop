<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>uDrop — Optical Pairing Card</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon-brand.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background:
        radial-gradient(circle at 30% 25%, var(--glass-09) 0%, transparent 44%),
        radial-gradient(circle at 72% 74%, var(--glass-ambient-blue) 0%, transparent 48%),
        var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      margin: 0;
      font-family: var(--font-family);
    }

    .qr-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 400px;
      width: 100%;
    }

    .card-wrapper {
      width: 100%;
      border-radius: 26px;
      overflow: hidden;
      background: var(--glass-03);
      backdrop-filter: blur(22px) saturate(185%);
      -webkit-backdrop-filter: blur(22px) saturate(185%);
      box-shadow: 0 25px 60px var(--shadow-dark-72), inset 0 1px 0 var(--glass-34);
      animation: floatCard 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card-wrapper:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 70px var(--shadow-dark-90), 0 0 1px 1px var(--glass-20);
    }

    .qr-showcase-canvas {
      display: block;
      width: 100%;
      height: 472px;
    }

    @keyframes floatCard {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (pointer: coarse), (max-width: 600px) {
      .btn-action {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-wrapper {
        animation: none;
        transition: none;
      }
    }

    .footer-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 14px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-action-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }

    .btn-action-primary:hover {
      background: var(--btn-primary-hover);
    }

    .btn-action-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-primary-hover);
      border: 1px solid var(--btn-secondary-border);
    }

    .btn-action-secondary:hover {
      background: var(--glass-12);
    }
  </style>
</head>
<body>
  <div class="qr-showcase">
    <!-- Single Unified Liquid Glass Pairing QR Card -->
    <div class="card-wrapper" id="cardWrapper">
      <canvas id="qrShowcaseCanvas" class="qr-showcase-canvas" aria-label="uDrop Optical Pairing Card"></canvas>
    </div>

    <!-- Actions -->
    <div class="footer-actions">
      <a href="/" class="btn-action btn-action-primary">Open Dashboard</a>
      <a id="downloadSvgBtn" href="/api/qr.svg?theme=obsidian" download="udrop-qr.svg" class="btn-action btn-action-secondary">Save Vector SVG</a>
    </div>
  </div>

  <script src="qr-kinetic.js"></script>
  <script>
    const canvas = document.getElementById('qrShowcaseCanvas');
    const kinetic = window.createKineticQr(canvas);
    let initialMobileCount = null;
    let paired = false;

    kinetic.assemble();

    const es = new EventSource('/api/mesh/events');
    es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'ring_update' && Array.isArray(msg.ring)) {
          const count = msg.ring.filter(n => n.assigned && !n.isHost).length;
          if (initialMobileCount === null) {
            initialMobileCount = count;
            return;
          }
          if (!paired && count > initialMobileCount) {
            paired = true;
            kinetic.disassemble('Device Connected', () => {
              setTimeout(() => { window.location.href = '/'; }, 400);
            });
          }
        } else if (msg.type === 'qr_scanned' && !paired) {
          paired = true;
          kinetic.disassemble('Pairing Phone...', () => {
            setTimeout(() => { window.location.href = '/'; }, 500);
          });
        }
      } catch {}
    };
  </script>
</body>
</html>
